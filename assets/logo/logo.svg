  <circle cx="51" cy="46" r="1.5" fill="#64748B"/>
  <circle cx="51" cy="52" r="1.5" fill="#64748B"/>
  <circle cx="30" cy="52" r="1.5" fill="#475569"/>
  <circle cx="30" cy="58" r="1.5" fill="#475569"/>
  <!-- Energy Pulse Wave -->
  <path d="M 12 70 Q 28 70 34 62 T 48 56 T 60 74 T 88 70" fill="none" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
